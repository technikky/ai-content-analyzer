[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-content-analyzer"
version = "0.1.0"
description = "Summarisation, sentiment, entity extraction and document Q&A, each with a measured baseline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nur Afzan Zulaikha" }]
keywords = [
  "nlp",
  "summarization",
  "sentiment-analysis",
  "named-entity-recognition",
  "question-answering",
  "fastapi",
  "nextjs",
  "structured-output",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.110",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.27"]
providers = ["httpx>=0.27"]
chroma = ["chromadb>=0.5"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27"]

[project.scripts]
analyzer = "analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/technikky/ai-content-analyzer"
Issues = "https://github.com/technikky/ai-content-analyzer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Typographic quotes are domain content, not typos: schemas.py maps them to ASCII as a
# repair step, and the name regex accepts a curly apostrophe inside names like O’Brien.
allowed-confusables = ["“", "”", "‘", "’"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's documented dependency-injection idiom, not the mutable-default bug B008 is for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.10"
files = ["src/analyzer"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["chromadb", "httpx", "uvicorn"]
ignore_missing_imports = true
